# Render service configuration for FastAPI backend
services:
  - type: web
    name: rhd-estimation-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    # Deliberately 1 worker (uvicorn's default with no --workers flag), not
    # the Dockerfile's 4: Render's web service tiers give this a small,
    # fixed CPU/RAM allocation that multiple worker *processes* would
    # compete over rather than benefit from, and DB_POOL_SIZE/
    # DB_MAX_OVERFLOW (app/config.py) are sized per worker -- raise this
    # only after checking both against the actual Render plan and DB
    # connection limit in use.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true

  # Purges works whose 7-day retention window has lapsed to archive stubs.
  # Runs out-of-process so a slow purge never occupies a web worker, and so
  # it still fires when the web service is asleep on lower Render tiers.
  - type: cron
    name: rhd-estimation-purge
    env: python
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: "./build.sh"
    startCommand: "python scripts/purge.py"