# RHD Cost Estimation System (RHD-CES)  ->  127.0.0.1:8003
# Source: /opt/rhd-ces/docker-compose.yml  (service: frontend)
# Repo:   github.com/Mazhar42/RHD-Estimation, deploy/nginx/
#
# Installed by hand once (DEPLOYMENT.md); CI never touches nginx.
# HTTP->HTTPS redirect and ACME challenges are handled globally in
# 000-catchall.conf.
server {
    # HTTP/2 is a socket-level option on nginx 1.24 and is set once for :443 in
    # 000-catchall.conf. Do not repeat it here.
    listen      443 ssl;
    listen [::]:443 ssl;

    server_name estimation.rhdbridge.com;

    ssl_certificate     /etc/letsencrypt/live/estimation.rhdbridge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estimation.rhdbridge.com/privkey.pem;
    include snippets/tls-params.conf;

    access_log /var/log/nginx/estimation.rhdbridge.com.access.log;
    error_log  /var/log/nginx/estimation.rhdbridge.com.error.log;

    # Item-master imports are capped at 20 MB by the app itself.
    client_max_body_size 25m;

    # Pure routing: the app's static files, cache rules and /api/ prefix are
    # its own frontend container's business (frontend/nginx.conf).
    location / {
        proxy_pass http://127.0.0.1:8003;
        include snippets/proxy-app.conf;
    }
}
