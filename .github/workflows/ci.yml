name: CI

# Every check a change must pass. Runs on pull requests and feature-branch
# pushes; deploy.yml calls it before building anything from main.
# Branch protection only needs to require the final "CI passed" check.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: a new Black release can reformat code that passed yesterday.
      - run: pip install black==26.5.1 flake8==7.3.0 pylint==4.0.8
      - name: Black
        run: black --check app/
      - name: flake8
        # E711: SQLAlchemy's `Column == None` filter idiom (IS NULL) is
        # correct and required; `is None` would silently break the query.
        run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503,E711
      - name: pylint (errors only)
        # E1101/E1102/E1128 are false positives on this stack: SQLAlchemy's
        # func.* proxy, Pydantic v2 FieldInfo, and a Protocol's optional
        # return type.
        run: pip install -r requirements.txt && pylint app/ --disable=all --enable=E,F --disable=E1101,E1102,E1128
      - name: No debug print() in app code
        run: "! grep -rn --include='*.py' -E '^\\s*print\\(' app/"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit safety -r backend/requirements.txt
      - name: No secret files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '\.env(\.[a-z]+)?\.example$|\.env\.development$'; then
            echo "::error::Environment/secret files are tracked (listed above)"; exit 1
          fi
          if git ls-files | grep -E '(^|/)(rhd-ces-deploy|id_(rsa|ed25519|ecdsa))(\.pub)?$|\.pem$'; then
            echo "::error::Key files are tracked (listed above)"; exit 1
          fi
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bandit
        run: bandit -q -r backend/app/
      - name: Dependency vulnerabilities
        # 64459 (CVE-2024-23342, ecdsa timing attack): ecdsa comes in via
        # python-jose, but the app only uses HS256, never the ECDSA path,
        # and no fixed ecdsa release exists. Revisit if ES* JWTs are added.
        run: safety check -r backend/requirements.txt --ignore 64459

  backend-tests:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (PostgreSQL, as in production)
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pytest -q
      - name: Migrations up, down and up again on PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/migrations
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c "CREATE DATABASE migrations"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-unit:
    name: Frontend unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: No critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      # The backend runs from ./backend with this throwaway SQLite database;
      # global-setup.js runs its admin/fixture scripts against the same one.
      DATABASE_URL: sqlite:///./e2e.db
      APP_ENV: test
      SECRET_KEY: e2e-only-not-a-secret
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
      E2E_PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start backend and frontend
        run: |
          (cd backend && alembic upgrade head && nohup uvicorn app.main:app --port 8035 > ../backend.log 2>&1 &)
          (cd frontend && VITE_DEV_BACKEND_PORT=8035 nohup npx vite --port 5173 --strictPort > ../vite.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fs http://localhost:5173/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::servers did not start"; cat backend.log vite.log; exit 1

      - run: npx playwright test
        working-directory: frontend

      - name: Keep traces and logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            backend.log
            vite.log
          retention-days: 7

  deploy-config:
    name: Deploy bundle + images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: |
          cp deploy/.env.example /tmp/ci.env
          sed -i -e 's/^SECRET_KEY=$/SECRET_KEY=x/' -e 's/^DB_PASSWORD=$/DB_PASSWORD=x/' /tmp/ci.env
          docker compose -f deploy/docker-compose.yml --env-file /tmp/ci.env config -q
          docker compose -f docker-compose.yml config -q
      - name: ShellCheck
        run: shellcheck deploy/*.sh backend/docker-entrypoint.sh
      - name: Images build
        run: |
          docker build -t rhd-backend:ci backend
          docker build -t rhd-frontend:ci frontend
      - name: Frontend container nginx config is valid
        run: docker run --rm rhd-frontend:ci nginx -t
      - name: Edge nginx site file is valid
        # The VPS's shared snippets and certificate aren't here; stand in
        # for them so the site file's own syntax is what gets checked.
        run: |
          mkdir -p /tmp/edge/snippets /tmp/edge/sites
          touch /tmp/edge/snippets/tls-params.conf
          echo 'proxy_http_version 1.1;' > /tmp/edge/snippets/proxy-app.conf
          sed -e 's#/etc/letsencrypt/live/[^/]*/fullchain.pem#/tmp/edge/cert.pem#' \
              -e 's#/etc/letsencrypt/live/[^/]*/privkey.pem#/tmp/edge/key.pem#' \
              -e 's#include snippets/#include /tmp/edge/snippets/#' \
              -e 's#/var/log/nginx/[^ ;]*#/dev/null#' \
              deploy/nginx/*.conf > /tmp/edge/sites/site.conf
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci \
            -keyout /tmp/edge/key.pem -out /tmp/edge/cert.pem 2>/dev/null
          printf 'events {}\nhttp {\n  include /tmp/edge/sites/*.conf;\n}\n' > /tmp/edge/nginx.conf
          docker run --rm -v /tmp/edge:/tmp/edge:ro nginx:1.27-alpine nginx -t -c /tmp/edge/nginx.conf

  ci-passed:
    name: CI passed
    if: always()
    needs: [backend-lint, security, backend-tests, frontend-unit, e2e, deploy-config]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::A required check did not succeed"; exit 1
          fi
