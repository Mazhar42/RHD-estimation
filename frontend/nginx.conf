# The app's own web server, inside the frontend container. Plain HTTP only:
# TLS and the hostname live in the VPS's edge nginx
# (deploy/nginx/estimation.rhdbridge.com.conf), which proxies everything here.

# /api/<path>?<query> -> /<path>?<query>, taken from the raw request URI so
# percent-encoded characters reach the backend unchanged.
map $request_uri $backend_uri {
    ~^/api(?<rest>/.*)$ $rest;
    default /;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Item-master imports are capped at 20 MB by the app itself.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The API, with the /api prefix stripped (the app's routes are /auth,
    # /estimations, ...). Same origin as the app, so the login cookies are
    # first-party and no CORS is involved.
    #
    # The backend's address is looked up per request through Docker's DNS
    # (resolver + variable): every deploy recreates the backend container
    # with a new IP, and a plain `proxy_pass http://backend:8000` would keep
    # the old one (502s) -- and refuse to start while the backend is down.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend$backend_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Forward what the edge told us; this server only ever sees plain
        # HTTP, so $scheme would wrongly say "http".
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/projects, /estimations/12, ...) all load the app;
    # index.html itself must never be cached or users keep an old build.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
